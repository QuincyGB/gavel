services:
  - type: web
    name: gavel
    runtime: python
    repo: https://github.com/QuincyGB/gavel
    branch: master
    buildCommand: pip install -r backend/requirements.txt
    startCommand: sh -c "cd backend && python -m uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
